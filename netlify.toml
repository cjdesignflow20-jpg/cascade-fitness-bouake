# ==========================================================================
# CASCADE FITNESS & SPA · CONFIGURATION NETLIFY
# ==========================================================================

[build]
  # Dossier racine contenant index.html
  publish = "."

# En-têtes de sécurité et d'optimisation du cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Mise en cache longue durée pour les polices, vidéos et images
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
